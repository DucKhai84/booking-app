server:
  port: 8082
  servlet:
    context-path: /notification-service

spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:root@localhost:27017/notification-service?authSource=admin}

  kafka:
    bootstrap-servers:
      - ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        spring.json.trusted.packages: "*"

app:
  service:
    base_url: https://api.brevo.com
    send_path: /v3/smtp/email
    api-key: ${BREVO_API_KEY}